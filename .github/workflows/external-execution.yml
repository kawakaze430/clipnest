name: ClipNest external checks (execution only)
on:
  workflow_dispatch:
    inputs:
      group:
        description: Run only a still-unverified group; all is a sequential bounded run
        type: choice
        options: [native, browser, terraform, containers, all]
        default: native
        required: true
permissions:
  contents: read
concurrency:
  group: clipnest-external-${{ github.ref }}-${{ inputs.group }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHECK_GROUP: ${{ inputs.group }}
      CLIPNEST_TEST_DATABASE_MODE: docker
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with: {node-version: 24, cache: npm}
      - name: Prepare only selected checks and retain preparation errors
        continue-on-error: true
        run: python3 scripts/ci/check.py --name preparation -- bash scripts/external/setup.sh "$CHECK_GROUP"
      - name: Execute and collect bounded evidence
        if: always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success'
        run: |
          if [ "$CHECK_GROUP" = all ]; then
            python3 scripts/external/verify.py run --groups native browser terraform containers --budget-minutes 20 --output qa-artifacts/return
          else
            python3 scripts/external/verify.py run --groups "$CHECK_GROUP" --budget-minutes 20 --output qa-artifacts/return
          fi
      - name: Package complete source even when an external check fails
        if: always() && steps.checkout.outcome == 'success'
        run: python3 scripts/package.py && python3 scripts/package.py --verify dist/clipnest-source.zip
      - name: Return complete source and sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipnest-external-${{ inputs.group }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            qa-artifacts/
            dist/clipnest-source.zip
            dist/clipnest-source.zip.sha256
