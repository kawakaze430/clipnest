<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator controls · ClipNest</title><link rel="stylesheet" href="/styles.css?v=1.2.0"><script src="/operator.js?v=1.2.0" type="module"></script></head><body><header class="topbar wrap"><a class="brand" href="/">clipnest.</a><a href="/account.html">My account</a></header><main class="account-page wrap"><h1>Operator controls</h1><p id="operator-message" role="status">Checking operator access…</p><section id="operator-panel" hidden><form id="controls-form" class="account-fields"><label class="deletion-confirm"><input id="downloads-paused" type="checkbox">Pause new downloads</label><label for="registration-mode">Registration</label><select id="registration-mode"><option value="invite">Invitation only</option><option value="closed">Closed</option><option value="open">Open</option><option value="config">Use deployment setting</option></select><button class="primary-button" type="submit">Save controls</button></form><form id="invite-form" class="account-fields"><label for="invite-email">Invite email address</label><input id="invite-email" type="email" required><button class="primary-button" type="submit">Send beta invitation</button></form><form id="disable-form" class="account-fields"><label for="disable-user-id">Account ID to disable</label><input id="disable-user-id" required pattern="[a-f0-9-]{36}"><button class="subtle-button" type="submit">Disable account and cancel work</button></form><h2>Current workload</h2><pre id="operator-state"></pre></section></main></body></html>
